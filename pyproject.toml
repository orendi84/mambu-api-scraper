[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mambu-api-tools"
version = "1.0.0"
description = "Fetch and render Mambu OpenAPI documentation"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.1",
    "urllib3>=1.26.12",
]

[project.scripts]
mambu-api-tools = "mambu_api_tools.cli:main"

[tool.setuptools]
packages = ["mambu_api_tools"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_fetcher.py" = ["E741", "F841", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
